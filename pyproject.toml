[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "abstract-gpt"
version = "0.1.17"
description = "Codex login and session management for the abstract toolserver"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "jrputkey"}]
# No abstract-claude here: Serve offers whichever providers are installed, and
# none requires another (the standalone abstract_gpt.serve keeps it via [serve]).
dependencies = ["prompt_toolkit>=3.0", "abstract-serve-core>=0.1.12", "abstract-toolserver>=0.0.43,<0.1"]
[project.optional-dependencies]
mcp = []
serve = ["abstract-claude>=0.1.61"]
[project.scripts]
abstract-gpt = "abstract_gpt.cli:main"
# `abstract-gpt serve` IS abstract-serve-core's one Serve console; this registers
# GPT among its providers (discovered from this metadata, loaded on demand).
[project.entry-points."abstract_serve_core.providers"]
gpt = "abstract_serve_core.providers:gpt"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pypit]
github_push = true

[tool.setuptools.package-data]
abstract_gpt = ["MCT-LICENSE.txt", "SHARED-CONSOLE.md", "serve.html"]

[project.urls]
Homepage = "https://github.com/AbstractEndeavors/abstract-gpt"
Repository = "https://github.com/AbstractEndeavors/abstract-gpt"
